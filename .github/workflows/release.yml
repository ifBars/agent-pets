name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - package.json
    tags:
      - "v*"
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Detect release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          should_release=false
          version=""
          tag=""

          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
            version="${tag#v}"
            should_release=true
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
            should_release=true
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="$(node -p "require('./package.json').version")"
            tag="v${version}"
            should_release=true
          else
            if git diff --name-only HEAD^ HEAD -- package.json | grep -qx "package.json"; then
              version="$(node -p "require('./package.json').version")"
              tag="v${version}"
              should_release=true
            fi
          fi

          if [ "${should_release}" = "true" ] && [ "${{ github.event_name }}" != "release" ]; then
            if gh release view "${tag}" >/dev/null 2>&1; then
              echo "Release ${tag} already exists; skipping."
              should_release=false
            elif bun pm view "agent-pets@${version}" version >/dev/null 2>&1; then
              echo "agent-pets@${version} is already published; skipping."
              should_release=false
            fi
          fi

          echo "should_release=${should_release}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.os }}
    if: needs.prepare.outputs.should_release == 'true' && github.event_name != 'release'
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools rpm

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build Windows
        if: runner.os == 'Windows'
        run: bun run dist:win

      - name: Build macOS
        if: runner.os == 'macOS'
        run: bun run dist:mac

      - name: Build Linux
        if: runner.os == 'Linux'
        run: bun run dist:linux

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-pets-${{ runner.os }}
          path: |
            dist/**/*.exe
            dist/**/*.msi
            dist/**/*.dmg
            dist/**/*.zip
            dist/**/*.AppImage
            dist/**/*.deb
            dist/**/*.rpm
            dist/**/*.blockmap
            dist/**/latest*.yml
          if-no-files-found: error

  github-release:
    name: Publish GitHub release assets
    if: needs.prepare.outputs.should_release == 'true' && github.event_name == 'push'
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ needs.prepare.outputs.tag }}" release-artifacts/* --generate-notes --title "${{ needs.prepare.outputs.tag }}" --target "${GITHUB_SHA}"

  npm-publish:
    name: Publish npm packages from GitHub release
    if: needs.prepare.outputs.should_release == 'true' && github.event_name == 'release'
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Publish Agent Pets
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"

          if bun pm view "agent-pets@${version}" version >/dev/null 2>&1; then
            echo "agent-pets@${version} is already published; skipping."
          else
            bun publish --access public
          fi

      - name: Publish OpenCode plugin
        working-directory: packages/opencode-agent-pets
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"

          if bun pm view "opencode-agent-pets@${version}" version >/dev/null 2>&1; then
            echo "opencode-agent-pets@${version} is already published; skipping."
          else
            bun publish --access public
          fi

  npm-publish-version-bump:
    name: Publish npm packages from version bump
    if: needs.prepare.outputs.should_release == 'true' && github.event_name == 'push'
    needs:
      - prepare
      - build
      - github-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Publish Agent Pets
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"

          if bun pm view "agent-pets@${version}" version >/dev/null 2>&1; then
            echo "agent-pets@${version} is already published; skipping."
          else
            bun publish --access public
          fi

      - name: Publish OpenCode plugin
        working-directory: packages/opencode-agent-pets
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"

          if bun pm view "opencode-agent-pets@${version}" version >/dev/null 2>&1; then
            echo "opencode-agent-pets@${version} is already published; skipping."
          else
            bun publish --access public
          fi
