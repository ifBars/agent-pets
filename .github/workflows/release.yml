name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - package.json
      - packages/opencode-agent-pets/package.json
    tags:
      - "v*"
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      release_exists: ${{ steps.release.outputs.release_exists }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Detect release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          should_release=false
          release_exists=false
          agent_pets_published=false
          opencode_agent_pets_published=false
          version=""
          tag=""

          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
            version="${tag#v}"
            should_release=true
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
            should_release=true
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="$(node -p "require('./package.json').version")"
            tag="v${version}"
            should_release=true
          else
            version="$(node -p "require('./package.json').version")"
            opencode_version="$(node -p "require('./packages/opencode-agent-pets/package.json').version")"

            if git show HEAD^:package.json > /tmp/previous-package.json 2>/dev/null; then
              previous_version="$(node -p "require('/tmp/previous-package.json').version")"
            else
              previous_version=""
            fi

            if git show HEAD^:packages/opencode-agent-pets/package.json > /tmp/previous-opencode-package.json 2>/dev/null; then
              previous_opencode_version="$(node -p "require('/tmp/previous-opencode-package.json').version")"
            else
              previous_opencode_version=""
            fi

            if [ "${version}" != "${previous_version}" ] || [ "${opencode_version}" != "${previous_opencode_version}" ]; then
              tag="v${version}"
              should_release=true
            fi
          fi

          opencode_version="$(node -p "require('./packages/opencode-agent-pets/package.json').version")"
          if [ -n "${version}" ] && [ "${opencode_version}" != "${version}" ]; then
            echo "Version mismatch: package.json is ${version}, packages/opencode-agent-pets/package.json is ${opencode_version}."
            exit 1
          fi

          if [ "${should_release}" = "true" ] && [ "${{ github.event_name }}" != "release" ]; then
            if gh release view "${tag}" >/dev/null 2>&1; then
              echo "Release ${tag} already exists; skipping."
              release_exists=true
            fi

            if bun pm view "@ifbars/agent-pets@${version}" version >/dev/null 2>&1; then
              echo "@ifbars/agent-pets@${version} is already published; skipping."
              agent_pets_published=true
            fi

            if bun pm view "opencode-agent-pets@${version}" version >/dev/null 2>&1; then
              echo "opencode-agent-pets@${version} is already published; skipping."
              opencode_agent_pets_published=true
            fi

            if [ "${release_exists}" = "true" ] && [ "${agent_pets_published}" = "true" ] && [ "${opencode_agent_pets_published}" = "true" ]; then
              should_release=false
            fi
          fi

          echo "should_release=${should_release}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "release_exists=${release_exists}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.os }}
    if: needs.prepare.outputs.should_release == 'true' && github.event_name != 'release'
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools rpm

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build Windows
        if: runner.os == 'Windows'
        run: bun run dist:win

      - name: Build macOS
        if: runner.os == 'macOS'
        run: bun run dist:mac

      - name: Build Linux
        if: runner.os == 'Linux'
        run: bun run dist:linux

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-pets-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.msi
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  github-release:
    name: Publish GitHub release assets
    if: needs.prepare.outputs.should_release == 'true' && needs.prepare.outputs.release_exists != 'true' && github.event_name != 'release'
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -d "" release_files < <(find release-artifacts -type f -print0)

          if [ "${#release_files[@]}" -eq 0 ]; then
            echo "No release artifact files found."
            exit 1
          fi

          gh release create "${{ needs.prepare.outputs.tag }}" "${release_files[@]}" --generate-notes --title "${{ needs.prepare.outputs.tag }}" --target "${GITHUB_SHA}"

  npm-publish:
    name: Publish npm packages from GitHub release
    if: needs.prepare.outputs.should_release == 'true' && github.event_name == 'release'
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Publish Agent Pets
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"

          if bun pm view "@ifbars/agent-pets@${version}" version >/dev/null 2>&1; then
            echo "@ifbars/agent-pets@${version} is already published; skipping."
          else
            bun publish --access public
          fi

      - name: Publish OpenCode plugin
        if: always()
        working-directory: packages/opencode-agent-pets
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"

          if bun pm view "opencode-agent-pets@${version}" version >/dev/null 2>&1; then
            echo "opencode-agent-pets@${version} is already published; skipping."
          else
            bun publish --access public
          fi

  npm-publish-version-bump:
    name: Publish npm packages from generated release
    if: always() && needs.prepare.outputs.should_release == 'true' && needs.build.result == 'success' && github.event_name != 'release' && (needs.prepare.outputs.release_exists == 'true' || needs.github-release.result == 'success')
    needs:
      - prepare
      - build
      - github-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Publish Agent Pets
        id: publish_agent_pets
        continue-on-error: true
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"

          if bun pm view "@ifbars/agent-pets@${version}" version >/dev/null 2>&1; then
            echo "@ifbars/agent-pets@${version} is already published; skipping."
          else
            bun publish --access public
          fi

      - name: Publish OpenCode plugin
        id: publish_opencode_agent_pets
        continue-on-error: true
        working-directory: packages/opencode-agent-pets
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"

          if bun pm view "opencode-agent-pets@${version}" version >/dev/null 2>&1; then
            echo "opencode-agent-pets@${version} is already published; skipping."
          else
            bun publish --access public
          fi

      - name: Check npm publish results
        run: |
          set -euo pipefail
          failed=false

          if [ "${{ steps.publish_agent_pets.outcome }}" != "success" ]; then
            echo "agent-pets publish failed."
            failed=true
          fi

          if [ "${{ steps.publish_opencode_agent_pets.outcome }}" != "success" ]; then
            echo "opencode-agent-pets publish failed."
            failed=true
          fi

          if [ "${failed}" = "true" ]; then
            exit 1
          fi
