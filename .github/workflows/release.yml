name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools rpm

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Build Windows
        if: runner.os == 'Windows'
        run: bun run dist:win

      - name: Build macOS
        if: runner.os == 'macOS'
        run: bun run dist:mac

      - name: Build Linux
        if: runner.os == 'Linux'
        run: bun run dist:linux

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-pets-${{ runner.os }}
          path: dist/**
